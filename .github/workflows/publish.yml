name: publish

# This machine's gh OAuth token lacks `write:packages`, and `gh auth refresh` is interactive, so
# the images are built and pushed here instead. GITHUB_TOKEN with `packages: write` is enough, and
# the resulting package is anonymously pullable, which is what Railway needs at deploy time.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: ubuntu
            image: deepseek-harness-railway
            version: 0.2.0-rc.2
          - flavor: nixos
            image: deepseek-harness-nixos-railway
            version: 0.1.0-rc.6
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.flavor }}
          push: true
          tags: |
            ghcr.io/bon5co/${{ matrix.image }}:latest
            ghcr.io/bon5co/${{ matrix.image }}:${{ matrix.version }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}
